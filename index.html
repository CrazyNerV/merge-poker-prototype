<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101a28">
  <meta name="description" content="4색 주사위를 머지하여 핸드를 완성하는 모바일 퍼즐">
  <title>Merge Dice — Branch Prototype</title>
  <link rel="stylesheet" href="style.css?v=20260826-5">
  <link rel="stylesheet" href="card-overrides.css?v=20260826-dice-2">
</head>
<body>
  <main class="game">
    <header>
      <div class="brand"><span>MERGE</span><strong>DICE</strong><small>D6 / D9 BRANCH</small></div>
      <div class="score-box"><span>SCORE</span><strong id="score">0</strong></div>
      <a class="round-btn leaderboard-link" href="leaderboard.html" aria-label="글로벌 리더보드">★</a>
      <button id="help-btn" class="round-btn" aria-label="게임 방법">?</button>
    </header>

    <section class="stage-bar">
      <div><span>STAGE</span><strong id="stage-count">—</strong></div>
      <div><span>FIX LEFT</span><strong id="fix-count">7</strong></div>
      <div class="progress"><i id="progress-fill"></i></div>
      <div><span>SPIN</span><strong id="spin-count">0</strong></div>
    </section>

    <section class="table" aria-label="주사위 보드">
      <div class="column-heads" aria-hidden="true">
        <span class="spade">⚄</span><span class="heart">⚄</span><span class="diamond">⚄</span><span class="club">⚄</span><span class="fix">FIX</span><span class="hand-head">HAND</span>
      </div>
      <div class="board-area">
        <div id="board" class="board"></div>
        <div id="hand-status" class="hand-status" aria-label="현재 족보"></div>
      </div>
      <div id="fx" class="fx" aria-live="polite"></div>
    </section>

    <section class="machine">
      <div id="reels" class="reels" aria-label="생산 릴"></div>
      <button id="spin-btn" class="spin-btn"><span>SPIN</span><small>FILL ALL</small></button>
    </section>

    <section class="legend">
      <span><i class="drag-icon">↗</i> 같은 색·눈의 주사위를 MERGE</span>
      <span><i class="slice-icon">✓</i> 활성화된 HAND 버튼을 눌러 제거</span>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <p id="modal-kicker">HOW TO PLAY</p><h1 id="modal-title">Merge Dice</h1>
      <div id="modal-body" class="modal-body"></div>
      <button id="modal-btn">게임 시작</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="backend-config.js?v=eda8e82"></script>
  <script src="game.js?v=20260826-score-2"></script>
</body>
</html>
